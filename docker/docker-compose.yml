name: english_practice_bot

services:
  db:
    image: postgres:latest
    container_name: postgres_ep
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis_ep
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq_ep
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-english}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ep
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/dockerfiles/api.Dockerfile
    container_name: api_ep
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../alembic.ini:/app/alembic.ini
      - ../api:/app/api
      - ../ai:/app/ai
      - ../core:/app/core
      - ../db:/app/db
      - ../enums:/app/enums
      - ../services:/app/services
      - ../worker:/app/worker
      - ../temp:/app/temp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/dockerfiles/worker.Dockerfile
    container_name: worker_ep
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../worker:/app/worker
      - ../ai:/app/ai
      - ../core:/app/core
      - ../db:/app/db
      - ../enums:/app/enums
      - ../services:/app/services
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/dockerfiles/frontend.Dockerfile
    container_name: frontend_ep
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - ../temp:/app/temp
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_started

  bot:
    build:
      context: ..
      dockerfile: docker/dockerfiles/bot.Dockerfile
    container_name: bot_ep
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../bot:/app/bot
      - ../ai:/app/ai
      - ../core:/app/core
      - ../db:/app/db
      - ../enums:/app/enums
      - ../worker:/app/worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  rabbitmq_data:
  frontend_node_modules:
